# Global LLM config (single LLM for ALL tiers and ALL agents).
# Boot default from YAML + env. Runtime override via agent.llm_config DB table
# (admin sets it via PUT /llm-config — hot-reloaded, no restart).

llm:
  provider: ollama              # ollama | gemini  (admin can switch at runtime)
  ollama:
    base_url: "http://ollama:11434"
    model: "qwen3:8b"            # better Hebrew + native tool calling than llama3.1:8b
  gemini:
    api_key: ""
    model: "gemini-2.0-flash"
  config_poll_seconds: 10       # how often config_store polls DB for runtime changes
  mock: false                   # set LLM_MOCK=true to use FakeListChatModel for tests
  request_timeout_seconds: 300  # max seconds for a single LLM inference call (small local models can be slow)

# Tiers differ ONLY in capability caps — NOT in model. All tiers use the same LLM.
# Admin is the owner/developer super-user, NOT a paid tier.
# HITL is automatic on write tools (save_numbers, trigger_scraper) — not configurable per tier.
tiers:
  free:
    recursion_limit: 6
    allowed_tools:
      - generate_form
      - get_statistics
      - analyze
    rag_corpora:
      - docs
    daily_budget_usd: 0.0       # Ollama is free; 0 = no limit
  paid:
    recursion_limit: 25
    allowed_tools:
      - generate_form
      - get_statistics
      - analyze
      - save_numbers            # write tool → HITL triggers automatically
      - list_saved_numbers
    rag_corpora:
      - docs
      - lottery_history
    daily_budget_usd: 5.0
  admin:
    recursion_limit: 50
    allowed_tools:
      - generate_form
      - get_statistics
      - analyze
      - save_numbers            # write tool → HITL triggers automatically
      - list_saved_numbers
      - trigger_scraper         # write tool → HITL triggers automatically
      - query_audit_log
      - read_token_usage
      - search_web
      - read_code               # read agent source code
      - list_files              # list agent source files
      - edit_file               # write tool → HITL triggers automatically
    rag_corpora:
      - docs
      - lottery_history
      - user_data               # admin sees ALL users' data (user_sub filter bypassed)
      - ops_logs
    daily_budget_usd: 0.0       # admin = owner, no budget limit

rag:
  embedding_model: "nomic-embed-text"
  top_k: 6
  user_data_scope: by_user_sub  # never trust LLM to self-scope

hitl:
  resume_timeout_hours: 168     # paused threads live 7 days in PostgresSaver

# gRPC client to Go lottery-stats-server
lottery_grpc:
  host: "lottery"
  port: "9090"

# Java BFF REST client (for saved numbers CRUD)
bff:
  base_url: "http://server:8082"

# Database
database:
  uri: "postgresql://postgres:postgres@db:5432/statistiloto"

# Security
security:
  jwt_verify: true              # set JWT_VERIFY=false for dev/tests
  jwks_url: ""
  issuer: ""
  audience: ""

logging:
  level: "INFO"
